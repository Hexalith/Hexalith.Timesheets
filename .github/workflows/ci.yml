name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-ci.yml@544fd2e907d62ccdc4b8f24168b8ab5dfcc13eb9
    with:
      solution: Hexalith.Timesheets.slnx
      test-platform: microsoft-testing-platform
      run-consumer-validation: true
      # The six blocking suites exceeded 30 minutes with coverage on 2026-10-23.
      build-timeout-minutes: 60
      # Every project is blocking. The live Dapr and performance facts retain their
      # existing explicit opt-ins; ordinary composed-host integration needs no Dapr.
      unit-test-projects: |
        tests/Hexalith.Timesheets.ArchitectureTests
        tests/Hexalith.Timesheets.Contracts.Tests
        tests/Hexalith.Timesheets.Server.Tests
        tests/Hexalith.Timesheets.Projections.Tests
        tests/Hexalith.Timesheets.Works.Tests
        tests/Hexalith.Timesheets.IntegrationTests

  apphost-configuration:
    name: Verify compiled AppHost configuration without resources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Initialize the root-declared build catalog
        run: git submodule update --init -- references/Hexalith.Builds
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore the AppHost package graph
        run: dotnet restore src/Hexalith.Timesheets.AppHost/Hexalith.Timesheets.AppHost.csproj -p:Configuration=Release -p:UseHexalithProjectReferences=false -m:1 /nr:false
      - name: Build the AppHost package graph
        run: dotnet build src/Hexalith.Timesheets.AppHost/Hexalith.Timesheets.AppHost.csproj --configuration Release --no-restore -p:UseHexalithProjectReferences=false -warnaserror -m:1 /nr:false
      - name: Exercise compiled fixture refusal and default selection
        run: python3 scripts/check_magic_link_apphost_guards.py --configuration-only --configuration Release --log-directory artifacts/apphost-configuration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apphost-configuration
          path: artifacts/apphost-configuration
          if-no-files-found: ignore

  verify-test-evidence:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: blocking-test-results
          path: TestResults
      - name: Require successful results from every test project
        run: python3 scripts/validate-test-results.py TestResults

  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Require Python 3.11 or newer for developer tooling
        run: python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else "Python 3.11+ is required")'
      - name: Exercise release and installed BMAD tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify selected magic-link index diagnostics
        run: python3 scripts/test_magic_link_index_selection.py -v
      - name: Verify isolated fixture drivers and diagnostic redaction
        run: python3 -m unittest discover -s scripts -p test_isolated_magic_link_dapr.py -v
