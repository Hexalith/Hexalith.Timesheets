name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify exact green main and release settings
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      publish-enabled: ${{ steps.preflight.outputs.publish-enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - id: preflight
        name: Require current main with successful exact-source CI
        env:
          GH_TOKEN: ${{ github.token }}
          HEXALITH_RELEASE_PUBLISH_ENABLED: ${{ vars.HEXALITH_RELEASE_PUBLISH_ENABLED }}
        run: python3 scripts/release-preflight.py source --allow-frozen

  release:
    needs: verify-source
    if: needs.verify-source.outputs.publish-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Trusted publishing matches release.yml, this repository, and production.
    # The short-lived key cannot cross jobs, so the exchange stays beside publish.
    environment: production
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Checkout approved Builds actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hexalith/Hexalith.Builds
          ref: 544fd2e907d62ccdc4b8f24168b8ab5dfcc13eb9
          path: .hexalith/builds-execution
          persist-credentials: false
      - name: Initialize root-declared submodules
        uses: ./.hexalith/builds-execution/Github/initialize-build
      - name: Initialize .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props', 'global.json', 'references/Hexalith.Builds/Props/Directory.Packages.props') }}
          restore-keys: nuget-
      - name: Install npm dependencies
        run: npm ci --ignore-scripts
      - name: Repair integrity-pinned npm bundled dependencies
        run: npm run repair:release-tooling
      - name: Audit installed npm dependencies
        run: npm audit
      - name: Verify npm dependency provenance and signatures
        run: npm audit signatures
      - name: Restore
        run: dotnet restore Hexalith.Timesheets.slnx
      - name: Build
        run: dotnet build Hexalith.Timesheets.slnx --no-restore --configuration Release -warnaserror
      - name: Revalidate current source before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The dispatched release source must be an exact lowercase commit SHA." >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "The checked-out release source does not match the dispatched commit SHA." >&2
            exit 1
          fi
          live_source_sha="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq '.object.sha')"
          if [ "$checked_out_sha" != "$live_source_sha" ]; then
            echo "The release source became stale during setup. Redispatch Release from the new main tip after exact-source CI succeeds." >&2
            exit 1
          fi
      - name: NuGet trusted publishing login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          HEXALITH_BUILDS_EXECUTION_SHA: 544fd2e907d62ccdc4b8f24168b8ab5dfcc13eb9
          HEXALITH_RELEASE_ENVIRONMENT: production
          HEXALITH_RELEASE_SOURCE_BRANCH: main
          HEXALITH_RELEASE_SOURCE_CI_WORKFLOW: ci.yml
          HEXALITH_RELEASE_PACKAGE_MANIFEST: tools/release-packages.json
          HEXALITH_RELEASE_EXPECTED_PACKAGE_COUNT: '6'
          HEXALITH_RELEASE_RESERVED_VERSION: ''
          HEXALITH_RELEASE_AUTHORITY_ISSUE_URL: ''
          HEXALITH_RELEASE_AUTHORITY_OWNER: ''
          HEXALITH_RELEASE_REQUIRE_AUTHORITY: 'false'
        run: npm exec --no -- semantic-release

  verify-publication:
    name: Verify exact-version official NuGet publication
    needs: [verify-source, release]
    # Also inspect partial writes after failure, but never enter a protected
    # environment or run verification for a source/freeze-skipped release.
    if: always() && needs.verify-source.result == 'success' && needs.release.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Require all manifest IDs at the exact source-tagged version
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
        run: python3 scripts/verify-publication.py --source-sha "$GITHUB_SHA" --release-result "$RELEASE_RESULT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: publication-verification
          path: artifacts/publication-verification.json
          if-no-files-found: ignore
