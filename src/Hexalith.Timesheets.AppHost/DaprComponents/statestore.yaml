# Development-only EventStore actor and command-status state. Never load this in
# the Timesheets sidecar. Redis DB 13 is distinct from its read-model DB 14.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "localhost:6379"
    - name: redisPassword
      value: ""
    - name: redisDB
      value: "13"
    - name: actorStateStore
      value: "true"
    - name: keyPrefix
      value: "none"
scopes:
  - eventstore
