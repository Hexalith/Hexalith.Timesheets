# Development-only projection store. The Timesheets sidecar loads only this
# directory and cannot discover EventStore's actor state component.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: timesheets-readmodels
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "localhost:6379"
    - name: redisPassword
      value: ""
    - name: redisDB
      value: "14"
    - name: keyPrefix
      value: "none"
scopes:
  - timesheets
